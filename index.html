<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#256b5b">
<title>FKN</title>
<style>
:root { --bg:#f6f7f4; --card:#ffffff; --ink:#16211d; --soft:#56655f; --line:#dfe4de; --accent:#256b5b; --on:#ffffff; --own:#eef4f0; --err:#a3312a; }
@media (prefers-color-scheme: dark) { :root { --bg:#111815; --card:#18211d; --ink:#eef2ee; --soft:#a3b0aa; --line:#2a3530; --accent:#5fc3aa; --on:#0d1512; --own:#1e2a25; --err:#f08a80; } }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width:640px; margin:0 auto; padding:12px 16px 96px; }
header { padding:8px 0 10px; }
h1 { font-size:22px; margin:0; font-weight:650; }
h2 { font-size:18px; margin:0 0 4px; font-weight:650; }
h3 { font-size:15px; margin:16px 0 6px; }
p { margin:0; }
.muted { color:var(--soft); }
.small { font-size:13px; }
.mono { font-family:ui-monospace, Menlo, Consolas, monospace; font-size:12px; overflow-wrap:anywhere; }
.error { color:var(--err); min-height:18px; margin-top:6px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; margin-top:12px; overflow:hidden; }
.pad { padding:14px; }
.thread { padding:4px 14px; min-height:160px; max-height:52vh; overflow-y:auto; }
.empty { padding:28px 14px; text-align:center; }
.msg, .poll { padding:10px 0; border-bottom:1px solid var(--line); }
.thread > :last-child { border-bottom:0; }
.msg.own { background:var(--own); margin:0 -14px; padding:10px 14px; }
.who { font-weight:600; font-size:14px; }
.time { font-weight:400; font-size:12px; margin-left:8px; }
.text { white-space:pre-wrap; overflow-wrap:anywhere; }
.body { margin-top:12px; line-height:1.65; }
.quote { font-size:13px; color:var(--soft); border-left:3px solid var(--line); padding-left:8px; margin:4px 0; overflow-wrap:anywhere; }
.acts { display:flex; gap:14px; align-items:center; margin-top:2px; flex-wrap:wrap; }
.receipt { font-size:12px; }
label { display:block; font-size:13px; color:var(--soft); margin:10px 0 4px; }
input, textarea { width:100%; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:6px; }
textarea { resize:vertical; }
input:focus, textarea:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.row { display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap; }
.between { justify-content:space-between; }
button { font:inherit; min-height:44px; padding:8px 16px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; }
button.primary { background:var(--accent); border-color:var(--accent); color:var(--on); font-weight:600; }
button.link { min-height:32px; padding:2px 0; border:0; color:var(--accent); font-size:13px; }
button.back { border:0; padding:4px 0; min-height:36px; color:var(--accent); }
button.chip { min-height:36px; padding:4px 14px; border-radius:18px; font-size:14px; }
button.chip.on { background:var(--own); border-color:var(--accent); color:var(--accent); font-weight:600; }
.chips { margin-top:6px; }
button.item { display:flex; flex-direction:column; align-items:flex-start; gap:2px; width:100%; text-align:left; border:0; border-bottom:1px solid var(--line); border-radius:0; padding:12px 14px; }
.card > button.item:last-child { border-bottom:0; }
.ititle { font-weight:600; }
.opt { display:block; width:100%; text-align:left; margin-top:6px; min-height:40px; }
button.opt.chosen { border-color:var(--accent); background:var(--own); font-weight:600; }
p.opt.static { border:1px solid var(--line); border-radius:10px; padding:8px 16px; }
.pollform { margin-top:12px; border-top:1px solid var(--line); padding-top:4px; }
.words { font-family:ui-monospace, Menlo, Consolas, monospace; background:var(--bg); border:1px dashed var(--line); border-radius:10px; padding:12px; margin-top:10px; line-height:1.9; }
.ask { border-top:1px solid var(--line); padding:10px 0 2px; margin-top:10px; }
.note { margin-top:16px; text-align:center; }
nav { position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; gap:6px; padding:8px 12px calc(8px + env(safe-area-inset-bottom)); background:var(--card); border-top:1px solid var(--line); }
button.tab { flex:1; max-width:200px; border:0; border-radius:10px; color:var(--soft); }
button.tab[aria-current] { background:var(--own); color:var(--accent); font-weight:650; }
</style>
</head>

<main id="app"></main>
