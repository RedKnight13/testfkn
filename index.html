<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Room</title>
<style>
:root { --bg:#f6f7f4; --card:#ffffff; --ink:#16211d; --soft:#56655f; --line:#dfe4de; --accent:#256b5b; --on:#ffffff; --own:#eef4f0; --err:#a3312a; }
@media (prefers-color-scheme: dark) { :root { --bg:#111815; --card:#18211d; --ink:#eef2ee; --soft:#a3b0aa; --line:#2a3530; --accent:#5fc3aa; --on:#0d1512; --own:#1e2a25; --err:#f08a80; } }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width:640px; margin:0 auto; padding:16px 16px 40px; }
header { padding:8px 0 12px; }
h1 { font-size:22px; margin:0; font-weight:650; }
h2 { font-size:17px; margin:0 0 4px; }
h3 { font-size:15px; margin:16px 0 6px; }
p { margin:0; }
.muted { color:var(--soft); }
.small { font-size:13px; }
.error { color:var(--err); min-height:18px; margin-top:6px; }
.list { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:4px 14px; min-height:180px; max-height:56vh; overflow-y:auto; }
.empty { padding:28px 0; text-align:center; }
.msg { padding:10px 0; border-bottom:1px solid var(--line); }
.msg:last-child { border-bottom:0; }
.msg.own { background:var(--own); margin:0 -14px; padding:10px 14px; }
.who { font-weight:600; font-size:14px; }
.time { font-weight:400; font-size:12px; margin-left:8px; }
.text { white-space:pre-wrap; overflow-wrap:anywhere; }
.receipt { font-size:12px; margin-top:2px; }
.footer, .host { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:12px; }
.host:empty { display:none; }
label { display:block; font-size:13px; color:var(--soft); margin:8px 0 4px; }
label:first-child { margin-top:0; }
input, textarea { width:100%; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
textarea { resize:vertical; margin-top:8px; }
input:focus, textarea:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.row { display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap; }
button { font:inherit; min-height:44px; padding:8px 16px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; }
button.primary { background:var(--accent); border-color:var(--accent); color:var(--on); font-weight:600; }
.ask { border-top:1px solid var(--line); padding:10px 0 2px; }
.note { margin-top:14px; text-align:center; }
</style>
</head>
<body>
