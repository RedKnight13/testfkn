# Builds the hourly edition: one static file holding the network's signed notes.
# Runs on GitHub's free runners. It needs network.json on the gh-pages branch.
name: edition

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edition
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/edition.mjs
      - name: Publish the edition if it changed
        run: |
          git config user.name "edition"
          git config user.email "edition@users.noreply.github.com"
          git add editions || true
          git diff --cached --quiet || (git commit -m "Edition $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
